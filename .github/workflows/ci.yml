name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pure-logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true

      # No extras: the pure-logic stages do not need torch or model weights,
      # so CI installs in seconds and never downloads a model.
      - name: Install (locked, without model runtimes)
        run: uv sync --frozen --python 3.12

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest (pure logic)
        run: uv run pytest -m "not model" -ra
