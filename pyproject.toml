[project]
name = "pii-extract"
version = "0.1.0"
description = "PII detection and redaction on GLiNER-family zero-shot NER: library, CLI, and GPU inference service."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Model runtimes are optional so the pure-logic stages (chunking, dedup,
# redaction) install and test without torch.
models = [
    "torch>=2.7",
    "gliner>=0.2.30",
    "gliner2>=2.1",
    # gliner loads mdeberta's SentencePiece vocab, whose conversion to a fast
    # tokenizer needs protobuf; neither package declares it.
    "protobuf>=5",
]
bench = [
    "datasets>=3.0",
]

[project.scripts]
pii-extract = "pii_extract.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_extract"]

# The RTX 5080 (Blackwell) needs CUDA 12.8 wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "model: needs model weights and the `models` extra (deselect with -m 'not model')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Offset tests deliberately contain NBSPs, em spaces and other look-alikes.
"tests/**" = ["RUF001"]
